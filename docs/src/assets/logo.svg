<svg viewBox="56 10 328 328" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c1d0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c3c1d0" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="rightFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c1d0" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#c3c1d0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="baseGrad" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="384" y2="0">
      <stop offset="0"    stop-color="#cfcdd9" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#cfcdd9" stop-opacity="0.9"/>
      <stop offset="0.86" stop-color="#cfcdd9" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#cfcdd9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="speedGrad" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="138" y2="0">
      <stop offset="0" stop-color="#9558b2" stop-opacity="0"/>
      <stop offset="1" stop-color="#9558b2" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <line x1="56" y1="250" x2="384" y2="250" stroke="url(#baseGrad)" stroke-width="2"/>

  <!-- context bars, fading toward the edges -->
  <rect x="88"  y="160" width="24" height="90"  rx="5" fill="url(#leftFade)"/>
  <rect x="328" y="160" width="24" height="90"  rx="5" fill="url(#rightFade)"/>

  <!-- trailing edge: grey bar leaving the window -->
  <rect x="128" y="140" width="24" height="110" rx="5" fill="#c3c1d0"/>

  <!-- active window bars -->
  <rect x="168" y="148" width="24" height="102" rx="5" fill="#5a70c1"/>
  <rect x="208" y="98"  width="24" height="152" rx="5" fill="#55924d"/>
  <rect x="248" y="130" width="24" height="120" rx="5" fill="#b55755"/>

  <!-- leading edge bar overlapping the right border -->
  <rect x="288" y="168" width="24" height="82"  rx="5" fill="#c3c1d0"/>

  <!-- window, centred at x=220 -->
  <rect x="140" y="84" width="160" height="180" rx="16"
        fill="none" stroke="#9558b2" stroke-width="6"/>

  <!-- motion / speed lines trailing left as the window slides right -->
  <g stroke="url(#speedGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="74"  y1="118" x2="136" y2="118"/>
    <line x1="100" y1="126" x2="136" y2="126"/>

    <line x1="68"  y1="174" x2="136" y2="174"/>

    <line x1="96"  y1="220" x2="136" y2="220"/>
    <line x1="74"  y1="226" x2="136" y2="226"/>
    <line x1="108" y1="232" x2="136" y2="232"/>
  </g>
</svg>
